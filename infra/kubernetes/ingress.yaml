apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tradingbot-ingress
  namespace: tradingbot
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.tradingbot.local
        - app.tradingbot.local
      secretName: tradingbot-tls
  rules:
    - host: api.tradingbot.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
    - host: app.tradingbot.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

